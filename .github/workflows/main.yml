name: Build APK CBT SMKN 14 Otomatis



on:

  push:

    branches: [ "main", "master" ]

  workflow_dispatch:



jobs:

  build-apk:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Source Code

        uses: actions/checkout@v4



      - name: Set up JDK 17

        uses: actions/setup-java@v4

        with:

          java-version: '17'

          distribution: 'temurin'



      - name: Setup Gradle

        uses: gradle/actions/setup-gradle@v3

        with:

          gradle-version: '8.5'



      - name: Build Signed Release APK (Siap Install di Semua HP)

        run: gradle assembleRelease



      - name: Siapkan File CBT_SMKN14_ExamBrowser.apk

        run: cp app/build/outputs/apk/release/app-release.apk CBT_SMKN14_ExamBrowser.apk



      - name: Upload APK Hasil Build

        uses: actions/upload-artifact@v4

        with:

          name: CBT_SMKN14_ExamBrowser_APK

          path: CBT_SMKN14_ExamBrowser.apk

